name: Release Linux binaries

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Manual runs verify packaging without publishing. Push a version tag to publish.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libclang-dev cmake pkg-config libfontconfig1-dev
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Check release version
        env:
          RELEASE_REF: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          python3 - <<'PY'
          import json, os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('Cargo.toml').read_text())['package']['version']
          assert json.loads(Path('plugin/manifest.json').read_text())['version'] == version
          if os.environ['REF_TYPE'] == 'tag':
              assert os.environ['RELEASE_REF'] == f'v{version}', 'Tag must match package version'
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'RELEASE_TAG=v{version}\n')
          PY
      - name: Build and test
        run: |
          ./scripts/build.sh
          cargo test --release --locked
          target/release/omabib --version
      - name: Package binary, licenses, and vendored source
        run: python3 scripts/package-release.py --version "$RELEASE_TAG" --source
      - name: Verify archive installation without build tools
        run: python3 scripts/test_release_install.py target/dist/omabib-*-linux-x86_64.tar.gz
      - name: Verify vendored source resolves offline
        run: |
          source_test_dir=$(mktemp -d)
          trap 'rm -rf "$source_test_dir"' EXIT
          tar -xzf "target/dist/omabib-${RELEASE_TAG#v}-source.tar.gz" -C "$source_test_dir"
          cd "$source_test_dir/omabib-${RELEASE_TAG#v}-source"
          CARGO_HOME="$source_test_dir/empty-cargo-home" cargo metadata --locked --offline --format-version 1 > /dev/null
      - name: Retain verified artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omabib-linux-x86_64
          path: target/dist/*
          if-no-files-found: error
      - name: Publish tagged release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd target/dist
          sha256sum --check SHA256SUMS
          release_flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then release_flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" ./*.tar.gz SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --title "Omabib $RELEASE_TAG" "${release_flags[@]}"
