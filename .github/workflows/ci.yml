# The release workflow tests only when a version tag is pushed, so a failure
# is invisible on a pull request. This runs that same test command on pull
# requests and on main, without packaging the app or bundling Qt.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libclang-dev pkg-config
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Select the stable toolchain
        if: runner.os == 'macOS'
        run: rustup update stable && rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Test
        # Same command as release.yml's macOS Test step (and the test half of
        # the Linux "Build and test" step). Packaging and Qt are not part of it.
        run: cargo test --release --locked --no-fail-fast
